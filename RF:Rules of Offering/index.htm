<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPP - Social Presence Simulator</title>
<style>
body{background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:20px;text-align:center}
h1{font-size:18px;font-weight:400;margin-bottom:8px;color:#aaa}
.topic{font-size:24px;margin-bottom:32px;color:#fff}
.avatars{display:flex;justify-content:center;gap:20px;margin-bottom:40px;flex-wrap:wrap}
.avatar{cursor:pointer;border:2px solid #333;border-radius:8px;padding:8px;background:#1a1a1a;transition:all 0.2s}
.avatar:hover{border-color:#555;transform:translateY(-4px)}
.avatar.selected{border-color:#0af;background:#002244}
.avatar img{width:120px;height:120px;object-fit:contain;image-rendering:pixelated;display:block}
.avatar-label{font-size:12px;margin-top:8px;color:#888}
.choices{display:flex;justify-content:center;gap:16px;margin-bottom:40px}
.choice-btn{font-size:18px;padding:12px 24px;border:none;border-radius:6px;cursor:pointer;color:#fff;font-weight:600;transition:opacity 0.2s}
.choice-btn:disabled{opacity:0.3;cursor:not-allowed}
.yes{background:#2a6df4}
.observe{background:#666}
.no{background:#e5484d}
.choice-btn:hover:not(:disabled){opacity:0.8}
.bar-container{max-width:500px;margin:0 auto;background:#222;border-radius:8px;overflow:hidden;height:24px;display:flex}
.bar{height:100%;transition:width 0.3s ease}
.bar-yes{background:#2a6df4}
.bar-observe{background:#666}
.bar-no{background:#e5484d}
.legend{max-width:500px;margin:12px auto 0;display:flex;justify-content:space-between;font-size:12px;color:#888}
.note{margin-top:60px;font-size:11px;color:#555;line-height:1.6}
</style>
</head>
<body>
<h1>Social Presence Simulator</h1>
<div class="topic">地域の安全について</div>
<div class="avatars">
<div class="avatar" data-avatar="police">
<img src="https://github.com/voice-of-japan/Virtual-Protest-Protocol/blob/main/police.gif?raw=true" alt="これは合法です">
<div class="avatar-label">これは合法です</div>
</div>
<div class="avatar" data-avatar="wheelchair">
<img src="https://github.com/voice-of-japan/Virtual-Protest-Protocol/blob/main/wheelChair_01.gif?raw=true" alt="車いすの参加者">
<div class="avatar-label">参加者</div>
</div>
<div class="avatar" data-avatar="vegi">
<img src="https://github.com/voice-of-japan/Virtual-Protest-Protocol/blob/main/vegi.gif?raw=true" alt="大根と人参">
<div class="avatar-label">大根と人参</div>
</div>
</div>
<div class="choices">
<button class="choice-btn yes" data-choice="yes" disabled>Yes</button>
<button class="choice-btn observe" data-choice="observe" disabled>Observe</button>
<button class="choice-btn no" data-choice="no" disabled>No</button>
</div>
<div class="bar-container">
<div class="bar bar-yes" id="bar-yes" style="width:0%"></div>
<div class="bar bar-observe" id="bar-observe" style="width:0%"></div>
<div class="bar bar-no" id="bar-no" style="width:0%"></div>
</div>
<div class="legend">
<span>Yes: <span id="count-yes">0</span></span>
<span>Observe: <span id="count-observe">0</span></span>
<span>No: <span id="count-no">0</span></span>
</div>
<div class="note">
これはシミュレーションです。個人の選択は記録・送信されません。<br>
This is a simulation. Individual choices are not recorded or transmitted.<br>
リロードすると全て消えます。 / Reload to reset.
</div>
<script>
let selectedAvatar=null;
const counts={yes:0,observe:0,no:0};
const avatars=document.querySelectorAll('.avatar');
const buttons=document.querySelectorAll('.choice-btn');
avatars.forEach(avatar=>{
avatar.addEventListener('click',()=>{
avatars.forEach(a=>a.classList.remove('selected'));
avatar.classList.add('selected');
selectedAvatar=avatar.dataset.avatar;
buttons.forEach(b=>b.disabled=false);
});
});
buttons.forEach(button=>{
button.addEventListener('click',()=>{
if(!selectedAvatar)return;
const choice=button.dataset.choice;
counts[choice]++;
updateBars();
});
});
function updateBars(){
const total=counts.yes+counts.observe+counts.no;
if(total===0)return;
document.getElementById('bar-yes').style.width=(counts.yes/total*100)+'%';
document.getElementById('bar-observe').style.width=(counts.observe/total*100)+'%';
document.getElementById('bar-no').style.width=(counts.no/total*100)+'%';
document.getElementById('count-yes').textContent=counts.yes;
document.getElementById('count-observe').textContent=counts.observe;
document.getElementById('count-no').textContent=counts.no;
}
</script>
</body>
</html>
